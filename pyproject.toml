[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "director-deck"
version = "0.1.0"
description = "Amplifier bundle: AI-powered slide deck generator with Veo 3.1 transitions"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-pptx>=0.6.23",
    "lxml>=4.0",
    "Pillow>=9.0",
    # The Chromium 153 build crashes on Linux ARM64; use the verified 140 build.
    "playwright>=1.55,<1.56; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "playwright>=1.44; platform_system != 'Linux' or platform_machine != 'aarch64'",
    "pyyaml>=6.0",
    # Keep an existing complete system pair; if either binary is missing,
    # static-ffmpeg lazily provisions a matched pair and selects it on PATH.
    "static-ffmpeg>=3.0",
]
# video_processor.py uses system ffmpeg/ffprobe when present and otherwise
# provisions static-ffmpeg lazily.

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require external tools (playwright, network)",
]

[tool.hatch.build.targets.wheel]
packages = ["director_deck"]
